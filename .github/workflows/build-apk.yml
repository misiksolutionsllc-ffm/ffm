name: Build & Release APK

on:
  push:
    branches: [main, 'claude/**']
    paths-ignore:
      - 'build-error.txt'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "flutter.sdk=$(which flutter | xargs dirname | xargs dirname)" >> android/local.properties

      - name: Flutter doctor
        run: flutter doctor -v 2>&1 | tee flutter-doctor.log

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (release)
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build-output.log

      - name: List build outputs
        if: always()
        run: |
          echo "=== Build outputs ==="
          find build -name "*.apk" 2>/dev/null || echo "No APK files found"
          ls -la build/app/outputs/flutter-apk/ 2>/dev/null || echo "Output dir not found"

      - name: Push error log on failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "=== FLUTTER DOCTOR ==="
            cat flutter-doctor.log 2>/dev/null || echo "No flutter-doctor.log"
            echo ""
            echo "=== BUILD OUTPUT (last 100 lines) ==="
            tail -100 build-output.log 2>/dev/null || echo "No build-output.log"
          } > build-error.txt

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add build-error.txt
          git commit -m "[skip ci] CI build error log from Run #${{ github.run_number }}"
          git push origin HEAD:${{ github.ref_name }} || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build-output.log
            flutter-doctor.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: farm-fresh-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90

      - name: Create Release
        if: success()
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Farm Fresh v${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
